id: ableton-devices
title: "Ableton Live Mastery"
subtitle: "Devices, History, and Techniques for Serious Producers"
format: walking-podcast
content_kind: episode
episode_dir: episodes
build_subdir: ableton-devices  # outputs land at <repo_root>/build/ableton-devices/...
target_duration_minutes: 40
tts_model: gpt-4o-mini-tts
tts_voice: onyx
episode_artist: "Ableton Live Mastery (narrator)"

# Podcast feed metadata (consumed by shared/tools/build_podcast_feed.py).
# Separate feed from IDM — listeners subscribe to either.
podcast:
  feed_path: podcast-ableton.xml          # <repo_root>/podcast-ableton.xml
  artwork_path: artwork-ableton.jpg       # TODO: build_podcast_art.py port
  repo_raw_base: "https://raw.githubusercontent.com/ZacharySBrown/idm-course/main"
  repo_web: "https://github.com/ZacharySBrown/idm-course"
  show_author: "Zak (raindog.ai)"
  show_email: "zak@raindog.ai"
  show_description: >-
    A device-by-device walking-podcast deep-dive into Ableton Live's instruments,
    effects, and Max for Live. Each episode pairs a device's history and synthesis
    theory with patch-walkthroughs and IDM-style production techniques. Hosted by
    a sardonic studio rat who reads Tape Op and refuses to use the word "journey."
  itunes_categories:
    - ["Music", null]
    - ["Education", "Courses"]
  copyright: "© 2026 Zak. Course content CC-BY-NC 4.0."
  itunes_type: serial
  enclosure_path_template: "build/ableton-devices/audio/episodes/{lesson_id}.mp3"
  deck_url_template: "{repo_web}/blob/main/build/ableton-devices/html/{lesson_id}/index.html"

episodes:
  - id: e01-operator
    title: "Operator: The FM Machine"
    status: published
  - id: e02-analog
    title: "Analog: The Subtractive Foundation"
    status: published
  - id: e03-wavetable
    title: "Wavetable: Morphing Through Spectra"
    status: editorial-locked   # scripts locked + fact-checked; needs songs + demo render
  - id: e04-meld
    # NOTE: research found "Physical Modelling Hybrid" is inaccurate — Meld is a
    # bi-timbral dual macro-oscillator MPE synth (modal resonators are its only
    # physical-modelling DSP, and only as filters). Consider retitling.
    title: "Meld: The Bi-Timbral Macro-Oscillator Synth"
    status: researched
  - id: e05-warp-modes
    title: "Warp Modes as Sound Design"
    status: researched
  - id: e06-drum-rack
    title: "Drum Rack + Simpler: The Sampler Engine"
    status: planned
  - id: e07-granulator
    title: "Granulator III: Clouds of Sound"
    status: planned
  - id: e08-spectral
    title: "Spectral Time + Reverb: Designing Space"
    status: planned
  - id: e09-m4l-generative
    title: "Max for Live: Generative Systems"
    status: planned
  - id: e10-racks
    title: "The Rack: Signal Chains as Instruments"
    status: planned
