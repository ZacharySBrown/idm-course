  # ── 03f — drive ─────────────────────────────────────────────────────────────
  - id: an-drive-sym-vs-asym
    concept: "Filter Drive: symmetric (odd harmonics) vs asymmetric (even harmonics)"
    what_you_hear: "The same resonant note played twice at the same cutoff: Drive=Sym (fuzzy, odd-harmonic, square-ward) then Drive=Asym (warmer, even-harmonic, tube-ish). Same sweep, different grit."
    structure: ab
    isolates: "F1 Drive mode (Sym2 vs Asym2)"
    duration_s: 5.0
    midi:
      notes:
        - {note: "C2", t: 0.0, length_s: 2.0}    # segment A: Sym
        - {note: "C2", t: 2.6, length_s: 2.0}    # segment B: Asym
    verification:
      check: drive-ab
      audible: "Same pitch/cutoff; A reads as harder/buzzier, B as warmer/rounder."
      spectral: "Segment A's added harmonics are predominantly ODD; segment B adds significant EVEN (notably 2nd) harmonic energy. Equal harmonic profiles ⇒ reject."
    ab_param: "F1 Drive"                         # A/B
    ab_values: ["Sym2", "Asym2"]                 # A=symmetric, B=asymmetric
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.453           # ~500 Hz; identical both segments
      "F1 Resonance": 0.4        # enough drive into the saturation stage
      "F1 Drive": "Sym2"         # segment A value (the ONE variable; B = Asym2)  # A/B
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.03
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.2            # ~120 ms
      "Key Error": 0.0

  # ── 04b — the Error thesis ──────────────────────────────────────────────────
  - id: an-error-drift
    concept: "Error → re-injected per-voice tuning drift ('make it analog')"
    what_you_hear: "The same sustained chord twice: Error=0 (dead-stable, clinical) then Error dialed up (each voice drifts slightly out of tune — the model 'comes alive')."
    structure: ab
    isolates: "Key Error (0 vs raised)"
    duration_s: 7.0
    midi:
      notes:
        # segment A: Error 0
        - {note: "C3", t: 0.0, length_s: 2.6}
        - {note: "E3", t: 0.0, length_s: 2.6}
        - {note: "G3", t: 0.0, length_s: 2.6}
        # segment B: Error raised
        - {note: "C3", t: 3.4, length_s: 2.6}
        - {note: "E3", t: 3.4, length_s: 2.6}
        - {note: "G3", t: 3.4, length_s: 2.6}
    verification:
      check: error-ab
      audible: "Segment A perfectly still; segment B has slow beating/chorusing between voices."
      spectral: "Segment B shows per-partial micro-detuning ⇒ amplitude beating / spectral-line broadening absent in A. A ≈ B ⇒ Error didn't engage ⇒ reject."
    ab_param: "Key Error"                        # A/B
    ab_values: [0.0, 0.35]                       # A=0 (stable), B=raised drift
    params:
      "Voices": "4"              # polyphony for the chord; per-voice Error needs voices
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "On"
      "OSC2 Shape": "Saw"
      "OSC2 Detune": 0.5         # 0 cents — keep Detune at 0 so Error is the ONLY drift source
      "OSC2 Balance": 1.0
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.741           # ~3000 Hz; open-ish, fixed
      "F1 Resonance": 0.1
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.15        # ~80 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.42           # ~400 ms
      "Key Error": 0.0           # segment A value (the ONE variable; B = 0.35)  # A/B

  # ── 04c — sync ──────────────────────────────────────────────────────────────
  - id: an-sync-ratio-sweep
    concept: "Hard-sync Ratio → tearing/formant sweep (the screaming sync lead)"
    what_you_hear: "One held note, the sync Ratio swept up: the waveform is hard-restarted faster and faster, the harmonics tearing upward into the classic screaming sync lead."
    structure: sweep
    isolates: "O1 Sub/Sync (sync ratio depth, OSC1 Mode = Sync)"
    duration_s: 5.0
    midi: {note: "C3", length_s: 4.7}
    verification:
      check: sync-sweep
      audible: "Constant fundamental pitch; a formant/harmonic peak sweeps upward as the sync ratio rises."
      spectral: "A moving formant peak / rising spectral centroid driven by the sync restart rate; fundamental stays fixed. Flat centroid ⇒ ratio sweep didn't take ⇒ reject."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Mode": "Sync"        # Sub/Sync slider now acts as sync ratio
      "O1 Sub/Sync": 0.0         # sync ratio depth; swept 0 → ~1 below
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 1.0             # wide open so sync content is unmasked
      "F1 Resonance": 0.0
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.03
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.2            # ~120 ms
      "Key Error": 0.0
    automation:
