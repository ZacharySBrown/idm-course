  # ── 06a — self-oscillation as a sound source (Digeridoo) ────────────────────
  - id: an-digeridoo-drone
    concept: "Play the self-oscillating filter as an instrument (the Digeridoo rebuild)"
    what_you_hear: "Oscillators off, Reso near max, a 24 dB LP ringing at its cutoff, noise-excited and key-tracked so the keyboard plays it — then an LFO sweeps the cutoff for the drone. The filter IS the oscillator (reedy/breathy, didgeridoo-like)."
    structure: single
    isolates: "Filter-as-oscillator (osc off, noise excitation, Reso near max, key-tracked Freq + LFO)"
    duration_s: 7.0
    midi:
      notes:
        - {note: "C1", t: 0.0, length_s: 3.2}    # play the self-osc filter as a pitched drone
        - {note: "G1", t: 3.4, length_s: 3.2}    # tracks the keyboard ⇒ it's an oscillator
    verification:
      check: self-osc-instrument
      audible: "A reedy pitched drone (dominant near-pure ring over a faint breath of noise) whose pitch follows the played note, with a slow LFO wobble on top."
      spectral: "Dominant resonant partial that changes pitch with MIDI note (key-tracked) over a low broadband noise floor; slow cyclic modulation at the LFO rate. No pitch tracking ⇒ Freq key-track didn't engage ⇒ reject."
    # NOTE: Analog's filter will NOT self-oscillate from bare resonance without an
    # excitation source (oscillators fully off → silence; confirmed by render).
    # ref: classic "filter-as-oscillator" technique (SOS subtractive primers; the
    # MS-20/Moog self-osc patch) excites a high-Q key-tracked filter with NOISE, not
    # a pitched osc. A low continuous noise feed makes the filter RING at its
    # (key-tracked) cutoff — so the pitched drone is provably the filter, not the
    # oscillator. (Using a Sine at the played pitch would be ambiguous: you couldn't
    # tell the filter from the osc. Noise excitation makes the assertion clean.)
    params:
      "OSC1 On/Off": "Off"       # oscillators OFF — the filter is the only pitched source
      "OSC2 On/Off": "Off"
      "Noise On/Off": "On"       # broadband noise EXCITES the resonant filter (it then rings at cutoff)
      "Noise Level": 0.35        # low feed — enough to ring the filter, not to swamp it
      "Noise Balance": 1.0       # noise routed fully into F1
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.36            # ~330 Hz base; key-track + LFO move it
      "F1 Resonance": 0.95       # very high Q — the filter rings (sings) at cutoff
      "F1 Drive": "Sym1"         # a little body/reed buzz
      "F1 Freq < Key": 1.0       # cutoff tracks MIDI pitch ⇒ the drone follows the keyboard (= it's an oscillator)
      "F1 Freq < LFO": 0.25      # LFO1 → F1 cutoff depth (the drone wobble)
      "F1 Freq < Env": 0.0
      "LFO1 On/Off": "On"
      "LFO1 Shape": "Sine"
      "LFO1 Sync": "Hertz"
      "LFO1 Speed": 0.5          # ~mid free rate — the drone wobble
      "AEG1 Attack": 0.1         # ~50 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AMP1 Level": 0.9          # high — a ringing-filter drone is quieter than an osc; lift it
      "AEG1 Rel": 0.3            # ~200 ms
      "Key Error": 0.0

  # ── 06b — MS-20 abused ──────────────────────────────────────────────────────
  - id: an-ms20-scream
    concept: "The MS-20 dual filter pushed past polite (HP→LP series, both screaming)"
    what_you_hear: "A saw through a resonant HP into a resonant LP in series, both cutoffs swept hard against each other into a vocal, screaming, semi-broken sweep — the Autechre move before the lo-fi degrade."
    structure: sweep
    isolates: "Both filter cutoffs swept in opposition (HP up while LP down)"
    duration_s: 6.0
    midi: {note: "C2", length_s: 5.7}
    verification:
      check: ms20-scream
      audible: "An aggressive, vocal, resonant sweep with a moving narrow pass-band; no clean/full moment."
      spectral: "Two resonant peaks converging then diverging as the cutoffs cross; high tonality at the crossing point. A static spectrum ⇒ the opposed automation didn't render ⇒ reject."
    # Distinct from an-ms20-series-filter (04d): here BOTH cutoffs sweep in
    # OPPOSITION and resonances are pushed extreme — the IDM abuse. Post-chain
    # (bitcrush + short reverb) is applied in the mix, not baked into this render.
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F1 To F2": 1.0            # full series amount
      "F1 Type": "High-pass 24dB/oct"
      "F1 Freq": 0.259           # ~150 Hz; HP sweeps UP (automation)
      "F1 Resonance": 0.85       # pushed
      "F1 Drive": "Asym2"
      "F1 Freq < Env": 0.0
      "F2 On/Off": "On"
      "F2 Type": "Low-pass 24dB/oct"
      "F2 Freq": 0.741           # ~3000 Hz; LP sweeps DOWN (automation, opposition)
      "F2 Resonance": 0.85
      "F2 Slave": "Off"
      "AEG1 Attack": 0.05        # ~10 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.24           # ~150 ms
      "Key Error": 0.05
    automation:
      "F1 Freq": {from: 0.259, to: 0.659, ramp_s: 5.5}   # ~150 → ~1800 Hz HP UP
      "F2 Freq": {from: 0.741, to: 0.507, ramp_s: 5.5}   # ~3000 → ~700 Hz LP DOWN (opposition)

  # ── 06c — looping envelope as rhythm ────────────────────────────────────────
  - id: an-loop-env-pulse
    concept: "Looping filter envelope (AD-R) = rhythm from one held note (no LFO, no sequencer)"
    what_you_hear: "A single held note; the filter envelope set to loop (AD-R) at a tempo-ish rate cycles the cutoff open and shut — an evolving rhythmic filter pulse with nothing sequencing it."
    structure: single
    isolates: "FEG1 Loop = AD-R (the envelope itself becomes the rhythm)"
    duration_s: 6.0
    midi: {note: "C2", length_s: 5.8}    # ONE sustained note — the loop does the rhythm
    verification:
      check: loop-env-rhythm
      audible: "A regular, repeating filter open/close pulse from a single sustained note."
      spectral: "Periodic spectral-centroid modulation at the loop rate (regular onsets) over one continuous note. No periodic motion ⇒ loop didn't engage ⇒ reject (the static-envelope failure mode from the ep1 rhythmic-demo lesson)."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.395           # ~350 Hz base; the looping env opens it
      "F1 Resonance": 0.55
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.8
      "FEG1 Loop": "AD-R"        # the ONE variable that makes this rhythmic
      "FEG1 Attack": 0.07        # ~40 ms — sets the pulse rise
      "FEG1 Decay": 0.3          # ~220 ms — sets the pulse fall; A+D = the loop period
      "FEG1 Sustain": 0.0
      "AEG1 Attack": 0.05        # ~10 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.24           # ~150 ms
      "Key Error": 0.0
