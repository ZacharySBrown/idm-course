    verification:
      check: step-self
      audible: "A sustained low growl with slow beating between two detuned saws; no per-note filter wow."
      spectral: "Steady detuned-saw spectrum with amplitude beating at the OSC1/OSC2 Δf; no per-note centroid sweep. Per-note wow still present ⇒ filter env not dropped ⇒ reject."
