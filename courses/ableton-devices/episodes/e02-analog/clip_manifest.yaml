        - {note: "G3", t: 0.0, length_s: 2.4}
        # segment B: unison 4 + detune
        - {note: "C3", t: 3.2, length_s: 2.4}
        - {note: "G3", t: 3.2, length_s: 2.4}
    verification:
      check: unison-ab
      audible: "Segment B is wider, thicker, and chorusing vs the thin segment A; same pitches."
      spectral: "Segment B shows each harmonic split into a cluster of detuned lines (stereo-widened, beating); segment A shows single clean lines. A ≈ B ⇒ Unison didn't engage ⇒ reject."
