  # ── 04d — MS-20 series filter ───────────────────────────────────────────────
  - id: an-ms20-series-filter
    concept: "Two filters in series: resonant HP → resonant LP (the MS-20 band)"
    what_you_hear: "A saw through a resonant high-pass into a resonant low-pass, the two cutoffs swept against each other: a vocal, hollow, band-limited sweep — the MS-20's HP→LP architecture rebuilt in Analog."
    structure: sweep
    isolates: "F1 Freq (HP) swept while F2 (LP) holds — the band edge moving"
    duration_s: 6.0
    midi: {note: "C2", length_s: 5.7}
    verification:
      check: ms20-series
      audible: "A pass-band that narrows/moves; resonant peaks on both edges; no all-pass 'full' moment."
      spectral: "Band-pass response (low and high roll-off simultaneously) with two resonant peaks; the lower edge sweeps with F1 Freq while the upper edge (F2) holds. A flat LP-only response ⇒ series routing didn't engage ⇒ reject."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0        # OSC1 fully into F1 first
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F1 To F2": 1.0            # full series amount (F1 → F2)
      "F1 Type": "High-pass 24dB/oct"   # resonant high-pass
      "F1 Freq": 0.305           # ~200 Hz start; the HP edge sweeps up (automation)
      "F1 Resonance": 0.65
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "F2 On/Off": "On"
      "F2 Type": "Low-pass 24dB/oct"    # resonant low-pass
      "F2 Freq": 0.705           # ~2400 Hz; held — the upper band edge
      "F2 Resonance": 0.65
      "F2 Slave": "Off"          # F2 does NOT follow F1 (independent edge)
      "AEG1 Attack": 0.05        # ~10 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.24           # ~150 ms
      "Key Error": 0.0
    automation:
      "F1 Freq": {from: 0.305, to: 0.676, ramp_s: 5.5}   # ~200 → ~2000 Hz HP edge sweep

  # ── 04f — unison supersaw ───────────────────────────────────────────────────
  - id: an-unison-supersaw
    concept: "Unison voices + Detune → the JP-8000 Supersaw (fat = many copies that almost agree)"
    what_you_hear: "A held chord played twice: Unison off (thin, single saw per note) then Unison 4 + Detune (a wide, shimmering supersaw wall). Same notes, four detuned copies each."
