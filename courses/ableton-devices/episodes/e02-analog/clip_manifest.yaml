# clip_manifest — every audio asset spliced into e02-analog.mp3.
#
# Two families:
#   song_clips   — extracted from acquired tracks via shared/tools/extract_clips.py
#   device_demos — rendered by the analog-render tool (AbletonOSC / M4L freeze
#                  pipeline; `an-` prefix). Mirrors e01's operator_demos family
#                  but the device is Ableton Analog (subtractive, AAS).
#
# Each entry's `id` matches a slide's `demos:` reference in episode.yaml.
# Output paths: <build_root>/audio/clips/<episode>/<id>.wav
#                = build/ableton-devices/audio/clips/e02-analog/<id>.wav
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED SOURCE WAVs — the user must acquire these and drop them in
#   songs/ableton-ep02/  (git-ignored; copyrighted — cite, don't commit)
# ─────────────────────────────────────────────────────────────────────────────
#   01_acid-tracks.wav      Phuture — "Acid Tracks" (1987, Trax)         [TB-303]
#   02_flash-light.wav      Parliament — "Flash Light" (1978)            [Minimoog]
#   03_digeridoo.wav        Aphex Twin — "Digeridoo" (1992, R&S)         [self-osc analog]
#   04_tri-repetae.wav      Autechre — Tri Repetae-era track (1995)      [MS-20/MC-202]
#   05_i-feel-love.wav      Donna Summer — "I Feel Love" (1977)          [Moog Modular] (bed/transition only)
#   06_can-you-feel-it.wav  Mr. Fingers — "Can You Feel It" (1986)       [Juno-60]    (bed/transition only)
#
# Acquire as 44.1k/16-or-24-bit stereo WAV. Filenames above are the `source:`
# values below; rename your rips to match (or edit `source:` per entry).
# Timestamps are from specs/ableton_course_ep2_analog_research.md §4; re-cut by
# ear if your rip differs — extract_clips.py re-slices on edit.

# Where the user drops acquired song WAVs. Override per entry if needed.
song_source_dir: songs/ableton-ep02

# ═══════════════════════════════════════════════════════════════════════════════
# SONG CLIPS — acquired-track excerpts (foreground cues, transitions, beds)
# ═══════════════════════════════════════════════════════════════════════════════
song_clips:

  # ── Foreground cues (referenced by id from episode.yaml > slides[].demos) ───
  - id: acid-tracks-cold-open
    source: "01_acid-tracks.wav"
    start: "1:27"
    end: "1:35"
    fade_in_ms: 600
    fade_out_ms: 1800
    normalize_lufs: -14          # song role under cold-open narration; master chain finishes it
    notes: "The squelchy resonant 303 alone, ~1:27 — cutoff/reso swept by hand. Under the cold open. Adjust start if the solo-303 region sits elsewhere in your rip."

  - id: flash-light-bass
    source: "02_flash-light.wav"
    start: "0:00"
    end: "0:08"
    fade_in_ms: 120
    fade_out_ms: 500
    normalize_lufs: -16
    notes: "Parliament — the elastic rubber-band Minimoog bass riff (stacked Minimoogs, pitch-bend). Drop under 02b 'rubber-band bass.' Move start to the bass-hook entry in your rip."

  - id: acid-tracks-303
    source: "01_acid-tracks.wav"
    start: "3:00"
    end: "3:10"
    fade_in_ms: 300
    fade_out_ms: 900
    normalize_lufs: -16
    notes: "A second, longer Acid Tracks excerpt for 02e — now the listener knows what the knobs do (accent, slide, resonance). Pick a busier 303 passage than the cold-open cut so they don't read as identical."

  - id: digeridoo-clip
    source: "03_digeridoo.wav"
    start: "0:20"
    end: "0:30"
    fade_in_ms: 300
    fade_out_ms: 900
    normalize_lufs: -16
    notes: "Aphex — the self-oscillating drone bass (no actual didgeridoo). For the A/B against an-digeridoo-drone in 06a. Pick a section where the drone is exposed over the break."

  - id: tri-repetae-clip
    source: "04_tri-repetae.wav"
    start: "0:30"
    end: "0:40"
    fade_in_ms: 300
    fade_out_ms: 900
    normalize_lufs: -16
    notes: "Autechre — resonant/self-oscillating filter texture (MS-20/MC-202, lo-fi processed). Reference for the an-ms20-scream A/B in 06b. Choose a passage where the resonant-filter timbre is foregrounded."

  # ── Transition cues (background music between sections) ─────────────────────
  #   Long fades, quiet normalization. Referenced from episode.yaml >
  #   transitions.insertions[].clip_id (currently TBD — wire these ids in after
  #   SCRIPT LOCK). extract_clips.py cuts them like song clips.
  - id: trans-flash-light          # after 02f-virtual-analog → into synthesis (03)
    source: "02_flash-light.wav"
    start: "0:30"
    end: "0:42"
    fade_in_ms: 2500
    fade_out_ms: 3500
    normalize_lufs: -22
    notes: "End of section 2 (history) → section 3 (synthesis). Warm Moog-bass groove under the door."

  - id: trans-i-feel-love          # after 03f-drive → into device (04)
    source: "05_i-feel-love.wav"
    start: "0:10"
    end: "0:24"
    fade_in_ms: 2500
    fade_out_ms: 3500
    normalize_lufs: -22
    notes: "End of section 3 (synthesis) → section 4 (Ableton deep-dive). The 16th-note Moog sequence as a pulse bed."

  - id: trans-can-you-feel-it      # after 04f-voice-architecture → into walkthrough (05)
    source: "06_can-you-feel-it.wav"
    start: "0:20"
    end: "0:34"
    fade_in_ms: 3000
    fade_out_ms: 4000
    normalize_lufs: -22
    notes: "End of section 4 (device) → section 5 (patch walkthrough). Warm Juno-60 chorus pad."

  - id: trans-acid-tracks          # after 05i-save → into IDM application (06)
    source: "01_acid-tracks.wav"
    start: "5:00"
    end: "5:12"
    fade_in_ms: 2500
    fade_out_ms: 3500
    normalize_lufs: -22
    notes: "End of walkthrough → section 6 (IDM). Squelchy 303 carries the two-bass payoff into the abuse section."

  - id: trans-tri-repetae          # after 06d-fat-principle → into the exercise
    source: "04_tri-repetae.wav"
    start: "2:00"
    end: "2:14"
    fade_in_ms: 3000
    fade_out_ms: 4500
    normalize_lufs: -22
    notes: "Before the listener-exercise outro. Late-Autechre stillness to land the episode."

  # ── Background beds (sidechain-ducked under narration) ──────────────────────
  #   Long, slow, loop-friendly, normalized quiet (-26 LUFS) so they sit far
  #   below the voice even before the duck. Referenced from episode.yaml >
  #   beds.insertions[].clip_id (TBD — wire after lock).
  - id: bed-flash-light            # section 2 (history)
    source: "02_flash-light.wav"
    start: "2:30"
    end: "3:10"
    fade_in_ms: 3500
    fade_out_ms: 4500
    normalize_lufs: -26
    notes: "Section 2 (history) bed — sparse Parliament groove, era-appropriate, low and slow."

  - id: bed-i-feel-love            # section 3 (synthesis)
    source: "05_i-feel-love.wav"
    start: "3:00"
    end: "3:40"
    fade_in_ms: 3500
    fade_out_ms: 4500
    normalize_lufs: -26
    notes: "Section 3 (synthesis deep-dive) bed — the relentless Moog sequence, hypnotic under theory."

  - id: bed-can-you-feel-it        # section 4 (device)
    source: "06_can-you-feel-it.wav"
    start: "1:30"
    end: "2:10"
    fade_in_ms: 4000
    fade_out_ms: 5000
    normalize_lufs: -26
    notes: "Section 4 (Ableton deep-dive) bed — Juno chorus pad, warm and stationary."

  - id: bed-tri-repetae            # section 6 (IDM application + outro)
    source: "04_tri-repetae.wav"
    start: "1:00"
    end: "2:00"
    fade_in_ms: 4000
    fade_out_ms: 5000
    normalize_lufs: -26
    notes: "Section 6 (IDM application + exercise) bed — late Autechre lo-fi stillness."

# ═══════════════════════════════════════════════════════════════════════════════
# DEVICE DEMOS — Ableton Analog patches, rendered headless (an- prefix)
# ═══════════════════════════════════════════════════════════════════════════════
# Rendered via the analog-render pipeline (AbletonOSC / M4L freeze; mirrors e01's
# operator_render — to be scaffolded for Analog). Each entry declares the patch
# parameters + MIDI clip + render settings, isolates ONE variable, and carries a
# teaching `structure` (ab | sweep | ladder | single) plus a `verification`
# block. Output: build/ableton-devices/audio/clips/e02-analog/<id>.wav
#
# PARAMETER NAMES — RECONCILED against the REAL probed LOM map
# (tools/device_render/param_maps/analog.json, 172 params). Every `params` and
# `automation` key below is now an EXACT LOM `name` from that file, and every
# value is either within the param's [min,max] (continuous) or an exact
# `value_items` string (quantized). The render JS (m4l/midi_instrument_render.js)
# sets continuous params with the RAW LOM value and looks up quantized strings in
# `value_items` → no normalization happens downstream, so values here are raw.
#
# VALUE CONVENTIONS (raw LOM, as the renderer consumes them):
#   Osc Shape     : "OSC1 Shape"/"OSC2 Shape" ∈ {Sine, Saw, Rect, Noise}
#   On/Off        : "...On/Off" ∈ {Off, On}  (e.g. "OSC1 On/Off", "OSC2 On/Off",
#                                              "F2 On/Off", "Noise On/Off")
#   Filter Type   : "F1 Type"/"F2 Type" ∈ {Low-pass 12dB/oct, Low-pass 24dB/oct,
#                   Band-pass 6dB/oct, Band-pass 12dB/oct, Notch 2-pole,
#                   Notch 4-pole, High-pass 12dB/oct, High-pass 24dB/oct,
#                   Formant 6dB/oct, Formant 12dB/oct}
#   Filter Drive  : "F1 Drive"/"F2 Drive" ∈ {Off, Sym1, Sym2, Sym3, Asym1, Asym2, Asym3}
#   Filter Freq   : "F1 Freq"/"F2 Freq" are NORMALIZED 0..1 (NOT Hz). Hz targets
#                   from the spec are mapped log-style (≈30 Hz→0.0 .. 15 kHz→1.0);
#                   the spectral checks care about relative motion, not exact Hz.
#   Resonance     : "F1 Resonance"/"F2 Resonance" 0..1  (= old %/100)
#   Osc Detune    : "OSC1 Detune"/"OSC2 Detune" 0..1, 0.5 = 0 cents, ±300c full
#                   → norm = 0.5 + cents/600
#   Sub level     : "O1 Sub/Sync"/"O2 Sub/Sync" 0..1 (sub weight when Mode=Sub)
#   Sync ratio    : "OSC1 Sync Ratio" is NOT a probed param; sync depth is the
#                   "O1 Sub/Sync" slider with "OSC1 Mode"=Sync (see an-sync-ratio-sweep)
#   Env times     : "AEG1 Attack/Decay/Rel", "FEG1 Attack/Decay" 0..1 (norm time;
#                   default Decay 0.6 ≈ moderate). Sustain "AEG1/FEG1 Sustain" 0..1 (=%/100)
#   Filter env amt: "F1 Freq < Env"/"F2 Freq < Env" −1..1 (= old Env Amount/100)
#   Env loop      : "FEG1 Loop"/"AEG1 Loop" ∈ {Off, AD-R, ADR-R, ADS-AR}
#   Env<Vel       : "FEG1 < Vel"/"AEG1 < Vel" 0..1
#   LFO→dest      : "F1 Freq < LFO" −1..1, "O1 PW < LFO" −1..1
#   Key-track     : "F1 Freq < Key" −1..1 (1.0 = full), osc "O1 Keytrack" 0..1
#   Unison        : "Unison On/Off" ∈ {Off, On}, "Unison Voices" ∈ {2, 4},
#                   "Unison Detune" 0..1
#   Voices        : "Voices" ∈ {Mono, 2, 4, 8, 12, 16, 20, 24, 28, 32}
#   Glide         : "Glide On/Off" {Off,On}, "Glide Mode" {Prop, Const},
#                   "Glide Legato" {Off,On}, "Glide Time" 0..1
#   Error         : the spec's global "Error" is the probed "Key Error" 0..1
#                   (random per-voice tuning drift). "Vib Error" is the vibrato one.
#
# AUTOMATION & A/B (renderer constraints):
#   * Continuous sweeps live in a SEPARATE top-level `automation:` block per demo,
#     as {"<LOM name>": {from, to, ramp_s}} in raw LOM units — the render JS
#     (scheduleAutomation) only reads demo.automation, NOT inline {automation:}
#     inside params. The static `params` value is set to the sweep's START.
#   * A/B demos: the render pipeline applies ONE param set per render and has no
#     in-clip param-change mechanism, so the old inline {ab:[A,B]} is not
#     renderable as-is. Each `ab_param`/`ab_values` pair below records BOTH the A
#     and B real values; the demo's static `params` value is set to segment A.
#     The B take is a hand/split render (README "render complex demos by hand"),
#     mirroring the e01 A/B precedent — flagged per demo with `# A/B`.
# Each demo sets every relevant param explicitly so it is self-contained (the
# render driver does not reset Analog between demos).
device_demos:

  # ── 03a — oscillator spectra ────────────────────────────────────────────────
  - id: an-pwm-sweep
    concept: "Pulse width → harmonic content (even harmonics appear)"
    what_you_hear: "One held note, constant pitch and loudness, the tone thinning and nasalizing as the duty cycle narrows from 50% — even harmonics fading in with no filter touched."
    structure: sweep
    isolates: "OSC1 PW"
    duration_s: 4.5
    midi: {note: "C3", length_s: 4.2}
    verification:
      check: pwm-sweep
      audible: "Pitch and loudness constant; only the timbre thins/nasalizes."
      spectral: "At PW=50% the spectrum is odd-harmonic-only (square); as PW narrows, even harmonics rise and energy spreads upward. Spectral centroid rises monotonically; even-harmonic energy increases start→end."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Rect"
      "OSC1 PW": 0.5               # 0.5 = 50% square; swept narrow by automation below
      "OSC1 Octave": 0
      "OSC1 Detune": 0.5          # 0.5 = 0 cents
      "O1 Sub/Sync": 0.0          # sub off
      "OSC1 Balance": 1.0         # full to F1
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"   # wide open so it does NOT color the demo
      "F1 Freq": 1.0              # ~max; effectively bypassed
      "F1 Resonance": 0.0
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.03         # ~5 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.15            # ~80 ms
      "Key Error": 0.0            # keep the spectrum clean so PW is the only variable
    automation:
      "OSC1 PW": {from: 0.5, to: 0.08, ramp_s: 4.0}   # 50% → narrow duty

  # ── 03b — slope ─────────────────────────────────────────────────────────────
  - id: an-slope-12-vs-24
    concept: "Filter slope (poles) → darkness above cutoff"
    what_you_hear: "The same held saw at the same cutoff, played twice: 12 dB then 24 dB. The 24 dB version is audibly darker above the cutoff — twice the roll-off."
    structure: ab
    isolates: "F1 Type slope (Low-pass 12dB/oct vs Low-pass 24dB/oct)"
    duration_s: 5.0
    midi:
      notes:
        - {note: "C3", t: 0.0, length_s: 2.0}    # segment A: 12 dB
        - {note: "C3", t: 2.6, length_s: 2.0}    # segment B: 24 dB
    verification:
      check: slope-ab
      audible: "Same pitch/cutoff both segments; segment B has less high-frequency content."
      spectral: "Segment B's spectral centroid and high-band energy are measurably lower than A's at the identical cutoff (steeper roll-off above f_c). A ≈ B ⇒ reject."
    # A/B: only F1 Type changes; cutoff, note, resonance, level held. Static params
    # render segment A (12 dB); B (24 dB) is the split/hand render.
    ab_param: "F1 Type"
    ab_values: ["Low-pass 12dB/oct", "Low-pass 24dB/oct"]   # A=12 dB, B=24 dB
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 12dB/oct"   # segment A value (the ONE variable)  # A/B
      "F1 Freq": 0.528            # ~800 Hz; same for both segments
      "F1 Resonance": 0.15        # slight, identical both segments
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.03
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.2            # ~120 ms
      "Key Error": 0.0

  # ── 03c — self-oscillation ──────────────────────────────────────────────────
  - id: an-reso-to-self-osc
    concept: "Resonance → self-oscillation (the filter becomes a sine oscillator)"
    what_you_hear: "A held saw with the resonance climbing from zero to maximum: a peak emerges at the cutoff, sharpens, then the filter sings its own near-pure sine — Barkhausen unity gain, by ear."
    structure: sweep
    isolates: "F1 Resonance (0 → 1)"
    duration_s: 6.0
    midi: {note: "C3", length_s: 5.7}
    verification:
      check: reso-self-osc
      audible: "Loudness roughly constant; a tuned peak emerges and turns into a sustained sine tone at the cutoff."
      spectral: "Narrow spectral peak at f_c grows and dominates; by clip end a single near-pure partial at the cutoff (low spectral spread, high tonality). Flat/absent peak ⇒ reject."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Balance": 1.0
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.482           # ~600 Hz; fixed so the sung sine is a clear pitch
      "F1 Resonance": 0.0        # the ONE variable, swept below
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.05        # ~10 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.24           # ~150 ms
      "Key Error": 0.0
    automation:
      "F1 Resonance": {from: 0.0, to: 1.0, ramp_s: 5.5}   # the ONE variable

  # ── 03d — beating (Reese) ───────────────────────────────────────────────────
  - id: an-reese-detune-sweep
    concept: "Detuning two saws → beating / phase-cancellation ('fat' = interference)"
    what_you_hear: "A held low note: two saws starting in unison (static), then OSC2 detuned 0 → 20 cents — the static tone blooms into a slow, accelerating 'wub' with no LFO anywhere."
    structure: sweep
    isolates: "OSC2 Detune (0 → 20 cents)"
    duration_s: 6.0
    midi: {note: "C1", length_s: 5.7}
    verification:
      check: reese-detune
      audible: "Pitch/loudness steady; an amplitude beating emerges and its rate rises as detune widens."
      spectral: "Onset of amplitude modulation (beat envelope) at Δf that increases start→end; near-zero AM at clip start. No AM growth ⇒ reject (the detune automation didn't take)."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Saw"
      "OSC1 Detune": 0.5         # 0 cents
      "OSC1 Balance": 1.0        # both oscs to F1
      "OSC2 On/Off": "On"
      "OSC2 Shape": "Saw"
      "OSC2 Detune": 0.5         # 0.5 = 0 cents; swept to +20c below
      "OSC2 Balance": 1.0
      "Noise On/Off": "Off"
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.594           # ~1200 Hz; low-ish, fixed — tames the saws but lets the beat through
      "F1 Resonance": 0.1
      "F1 Drive": "Sym1"         # touch of body
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.05        # ~10 ms
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.24           # ~150 ms
      "Key Error": 0.0           # the beating must come from Detune, not from Error drift
    automation:
      "OSC2 Detune": {from: 0.5, to: 0.533, ramp_s: 5.5}   # 0 → +20 cents (0.5 + 20/600)

  # ── 03d — PWM strings ───────────────────────────────────────────────────────
  - id: an-pwm-strings
    concept: "LFO → Pulse Width = one oscillator behaving like two (PWM strings)"
    what_you_hear: "A single rectangular oscillator on a held chord, an LFO slowly sweeping the pulse width: a lush, chorusing string-ensemble shimmer from one oscillator and no chorus effect."
    structure: single
    isolates: "LFO1 → OSC1 PW (O1 PW < LFO); everything else held"
    duration_s: 5.0
    midi:
      notes:
        - {note: "C3", t: 0, length_s: 4.6}
        - {note: "Eb3", t: 0, length_s: 4.6}
        - {note: "G3", t: 0, length_s: 4.6}
    verification:
      check: pwm-strings
      audible: "Steady chord with a slow chorusing/phasing movement; no second oscillator, no chorus device."
      spectral: "Periodic motion of the sinc nulls at the LFO rate — a slow, regular spectral modulation matching LFO1 Speed. Static spectrum ⇒ the LFO→PW routing didn't take ⇒ reject."
    params:
      "OSC1 On/Off": "On"
      "OSC1 Shape": "Rect"
      "OSC1 PW": 0.5             # LFO modulates around this center
      "OSC1 Balance": 1.0
      "O1 PW < LFO": 0.35        # LFO1 → OSC1 Pulse Width depth (−1..1)
      "OSC2 On/Off": "Off"
      "Noise On/Off": "Off"
      "LFO1 On/Off": "On"
      "LFO1 Shape": "Sine"
      "LFO1 Sync": "Hertz"       # free-running rate
      "LFO1 Speed": 0.15         # slow chorus rate (norm; free Hz)
      "F1 On/Off": "On"
      "F2 On/Off": "Off"        # keep F2 out of the chain (renderer does not reset)
      "F1 Type": "Low-pass 24dB/oct"
      "F1 Freq": 0.787           # ~4000 Hz; gentle top-end taming, fixed
      "F1 Resonance": 0.05
      "F1 Drive": "Off"
      "F1 Freq < Env": 0.0
      "AEG1 Attack": 0.35        # ~300 ms — slow string swell
      "AEG1 Decay": 0.0
      "AEG1 Sustain": 1.0
      "AEG1 Rel": 0.5            # ~600 ms
      "Key Error": 0.08          # small drift adds ensemble width (still one osc)

  # ── 03e — filter env vs amp env ─────────────────────────────────────────────
  - id: an-filter-env-vs-amp-env
    concept: "Same envelope, two destinations: filter env = brightness, amp env = loudness"
    what_you_hear: "One decay shape played twice. First on the FILTER envelope: the note 'plucks' brighter→darker at constant volume. Then on the AMP envelope: the loudness drops while the timbre stays put. Same shape, opposite result."
    structure: ab
    isolates: "Decay envelope destination (filter Freq vs amp Level)"
    duration_s: 6.0
    midi:
      notes:
        - {note: "C3", t: 0.0, length_s: 2.2}    # segment A: filter env decay, amp sustained
        - {note: "C3", t: 3.0, length_s: 2.2}    # segment B: amp env decay, filter static
    verification:
      check: env-destination-ab
      audible: "Segment A: constant loudness, brightness collapses (a wah/pluck). Segment B: loudness collapses, brightness constant."
      spectral: "A: RMS roughly flat while spectral centroid falls over the note. B: centroid roughly flat while RMS falls. If both segments behave the same ⇒ reject (the routing didn't differ)."
    # A/B: the decay TIME/shape is identical between segments; only its destination
    # moves. Multiple params differ A↔B, recorded below; static params = segment A.
    ab_params:                                   # A/B
      "F1 Freq < Env": [0.7, 0.0]                # A: filter env drives cutoff; B: off
      "AEG1 Decay": [0.0, 0.5]                   # A: no amp decay (sustained); B: ~600 ms decay
