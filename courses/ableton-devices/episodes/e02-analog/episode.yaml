id: e02-analog
title: "Analog: The Subtractive Foundation"
device: Analog
synthesis_type: "Subtractive (VCO → VCF → VCA)"
week: 2                        # episode-number alias for shared build_episode
target_duration_minutes: 40
ableton_manual_url: "https://www.ableton.com/en/manual/live-instrument-reference/"

idm_primary_artists:
  - Aphex Twin
  - Autechre
  - Squarepusher
idm_primary_records:
  - "Aphex Twin — Selected Ambient Works 85-92"
  - "Autechre — Tri Repetae"
  - "Plastikman — Sheet One"
adjacent_genres:
  - acid house
  - Detroit techno
  - drum and bass

# Bibliography references checked by validate.ts; full entries in references/bibliography.json.
# NOTE: ep02 bib keys to be added during scripting — listed here as the citation
