  - bib:sos_oberheim_sem
  - bib:wikipedia_prophet5
  - bib:rbma_dj_pierre_phuture
  - bib:roland_articles_hsoc
  - bib:musicradar_saunderson_reese
  - bib:ni_reese_bass
  - bib:vintagesynth_ms20
  - bib:szabo_supersaw
  - bib:huovilainen_dafx04
