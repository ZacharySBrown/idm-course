id: e04-meld
title: "Meld: The Bi-Timbral Macro-Oscillator Synth"
device: Meld
synthesis_type: "Macro-oscillator (24+1 algorithm bank, two macros each), bi-timbral, MPE-first"
week: 4                        # episode-number alias for shared build_episode
target_duration_minutes: 40
ableton_manual_url: "https://www.ableton.com/en/manual/live-instrument-reference/"

# NOTE (from dossier, specs/ableton_course_ep4_meld_research.md): the original brief
# subtitle "Physical Modelling Hybrid" is INACCURATE and has been dropped — Meld is a
# macro-oscillator synth; the ONLY physical-modelling DSP is the Plate/Membrane Resonator
# FILTERS (modal). Meld shipped in Live 12.0 (5 March 2024), NOT 12.1; the Chord oscillator
# was added in 12.2 (24 osc types at launch, 25 for a 12.4 user). Suite-only.

idm_primary_artists:
  - Aphex Twin        # kinship only — per-note timbre (Iridium collab, AFX Mode), NOT Meld credit
  - Autechre          # kinship only — self-sequencing-timbre aesthetic, NOT Meld credit
  - Squarepusher      # honest negative — builds his own tools; would treat macros as raw material
idm_primary_records:
  - "Plaid — Polymer"                          # timbre-as-composition exemplar (technique, not Meld)
  - "Boards of Canada — Geogaddi"              # environmental-texture target (analog/sampler, not Meld)
  - "Mutable Instruments Plaits — the lineage" # the macro-oscillator genre-definer, open-source DSP
adjacent_genres:
  - modular / Eurorack
  - ambient / generative
  - MPE performance / IDM

