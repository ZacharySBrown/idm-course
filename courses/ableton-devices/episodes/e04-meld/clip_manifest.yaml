    duration_s: 8.0
    midi: {note: "C3", length_s: 7.6}
    verification:
      check: self-sequence
      audible: "From a single sustained key: a recurring rhythmic/timbral pattern, with a grainy sideband edge — no new note onsets."
      spectral: "Onset/timbre events recur on a steady grid from one held note; audio-rate LFO adds sidebands. No recurrence ⇒ the loop env didn't engage ⇒ reject."
