      "Global Limiter": "On"
      "Stacked Voices": 2
      "Spread": 0.3                               # small unison detune for width (normalized)
      "Global Scale": "C Minor"
      "Voicing": "Poly"
    matrix:
      - {source: "Engine A LFO 1", target: "Engine B Osc Macro 1", amount: 0.6}
      - {source: "Engine A Mod Env", target: "Engine A Osc Macro 1", amount: 0.7}
      - {source: "MPE Press", target: "Engine B Osc Macro 1", amount: 0.7}
      - {source: "MPE Slide", target: "Engine A Filter Macro 1", amount: 0.5}

  - id: meld-twohands-final
    concept: "The finished 'Two-Hands' patch — two engines, ten fingers — played as a short MPE phrase"
    what_you_hear: "The complete bi-timbral MPE patch played as a short expressive phrase: in-key saw body, glassy resonant FM layer, self-morphing, each note shaped by the hand."
