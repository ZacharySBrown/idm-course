  # ── 06a — Self-sequencing timbre: one note becomes a pattern (the Autechre move)
  - id: meld-self-sequence-onenote
    concept: "Modulate the timbre instead of writing the notes — a looping Mod Env + audio-rate LFO turn ONE held note into a pattern"
    what_you_hear: "A single held note that becomes a rhythmic, evolving pattern: the timbre cycles (Mod Env AD-Loop → macro) while an audio-rate LFO adds sideband grit. No new notes."
    structure: single                 # justification: the whole point is ONE note producing a pattern — A/B would break the illusion
    isolates: "A Mod Loop Mode (AD Loop) → A Osc Shape + audio-rate A LFO 1 → A Filter Freq, on one held note"
    duration_s: 8.0
    midi: {note: "C3", length_s: 7.6}
    verification:
      check: self-sequence
      audible: "From a single sustained key: a recurring rhythmic/timbral pattern, with a grainy sideband edge — no new note onsets."
      spectral: "Onset/timbre events recur on a steady grid from one held note; audio-rate LFO adds sidebands. No recurrence ⇒ the loop env didn't engage ⇒ reject."
    # !! NO-MATRIX-FALLBACK: BOTH the self-sequence (Mod Env → Osc Shape) and the
    #    audio-rate grit (LFO → Filter Freq) are matrix routes → unrenderable
    #    headless. ORCHESTRATOR must hand-build this one to prove the self-sequence
    #    recurrence. Fallback automation is a single Osc-Shape morph (audible, not
    #    recurring) — will NOT pass self-sequence. Note "A LFO 1 Rate" is
    #    NORMALIZED 0–1 (1.0 = top ≈200 Hz audio-rate), NOT 200. Flagged in
    #    DEMO_VERIFICATION.md.
    params:
      "A On": 1
      "A Osc Type": 0                            # Basic Shapes
      "A Osc Shape": 0.40                         # center the AD-Loop env sweeps (matrix target)
      "A Osc Tone": 0.50
      "A Filter On": 1
      "A Filter Type": 0
      "A Filter L-B-H-N": 0.0
      "A Filter Freq": 0.6                        # cutoff (modulated by audio-rate LFO via matrix)
      "A Filter Q": 0.2
      "A Mod Loop Mode": 2                       # AD Loop=2 (idx55, 0–3; order UNCERTAIN — CONFIRM)
      "A Mod Attack": 0.1
      "A Mod Decay": 0.35                         # sets the self-sequence period
      "A LFO 1 Type": 0
      "A LFO 1 Rate": 1.0                        # ref: "A LFO 1 Rate" NORMALIZED 0–1; 1.0 = top of range (~200 Hz, audio-rate)
      "A Amp Attack": 0.05
      "A Amp Sustain": 1.0
      "A Amp Release": 0.3
      "A Volume": 0.7
      "B On": 0
    automation:
      # FALLBACK ONLY (single morph; will NOT pass self-sequence recurrence):
      "A Osc Shape": {from: 0.40, to: 0.70, ramp_s: 7.0}
    matrix:
      # HAND-BUILD (not renderable; kept for tutorial/.adv):
      - {source: "A Mod Env", target: "A Osc Shape", amount: 0.8}    # AD-Loop self-sequence
      - {source: "A LFO 1", target: "A Filter Freq", amount: 0.5}    # audio-rate → sideband grit

  # ── 06b — Environmental oscillators as composition (Rain/Crackle as source) ───
  - id: meld-rain-crackle-sub
    concept: "A synthesized environmental oscillator (Rain/Crackle) is the SOURCE, not an effect — evolving weather from a held note"
    what_you_hear: "An evolving synthesized-weather bed: Engine A is Rain (drops + wind), slowly evolving as a looping envelope drives its macro, over a quiet Sub from Engine B for body."
    structure: single                 # justification: a texture bed is a single evolving sound; A/B isn't the lesson here
    isolates: "A Osc Type = Rain as the sound source (Rate macro evolves; Mod-Env-Loop route is hand-build)"
    duration_s: 8.0
    midi: {note: "C2", length_s: 7.6}
    verification:
      check: self-sequence
      audible: "A clearly synthesized rain/weather texture (not a sample) that evolves over the hold, with a low sub body underneath."
      spectral: "Broadband stochastic 'rain' content evolving over time + a low sub fundamental from Engine B. Static/flat ⇒ Mod Env evolution didn't engage ⇒ reject."
    # NO-MATRIX-FALLBACK that WORKS: the true evolution comes from a Loop Mod Env
    # → Rain Rate (matrix, hand-build). But the fallback below automates the Rate
    # macro ("A Osc Tone") DIRECTLY — Rain's broadband content genuinely evolves
    # as Rate sweeps, so this fallback DOES produce evolving weather and can pass
    # the evolution check (it is a monotonic evolution, not a strict loop). The
    # matrix block is kept for the looping-tutorial version. See DEMO_VERIFICATION.md.
    params:
      "A On": 1
      "A Osc Type": 12                           # ref: Rain = index 12
      "A Osc Shape": 0.50                         # macro 1 = Tone
      "A Osc Tone": 0.40                          # macro 2 = Rate — swept by automation below (the evolution)
      "A Filter On": 1
      "A Filter Type": 0
      "A Filter L-B-H-N": 0.0
      "A Filter Freq": 0.7
      "A Mod Loop Mode": 1                       # Loop=1 (idx55, 0–3; order UNCERTAIN — for hand-build only)
      "A Mod Attack": 0.5
      "A Mod Decay": 1.0
      "A Amp Attack": 0.3
      "A Amp Sustain": 1.0
      "A Amp Release": 0.5
      "A Volume": 0.7
      "B On": 1
      "B Osc Type": 18                           # ref: Sub = index 18 — quiet body
      "B Osc Shape": 0.3                          # macro 1 = Tone
      "B Osc Tone": 0.2                           # macro 2 = Aux
      "B Volume": 0.4
      "B Filter On": 1
      "B Filter Type": 0
      "B Filter L-B-H-N": 0.0
      "B Filter Freq": 0.4
    automation:
      # WORKING FALLBACK: sweep Rain's Rate macro directly = evolving weather:
      "A Osc Tone": {from: 0.20, to: 0.80, ramp_s: 7.0}
    matrix:
      # TUTORIAL/.adv version (Loop env → Rate; not renderable over LOM):
      - {source: "A Mod Env", target: "A Osc Tone", amount: 0.7}   # Loop env → Rain Rate

