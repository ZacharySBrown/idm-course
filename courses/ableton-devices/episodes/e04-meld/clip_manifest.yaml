  # ── 06c — The Shepard trick, back to the cold open: endless build under a pad ─
  - id: meld-shepard-under-pad
    concept: "The cold-open Shepard's Pi oscillator, put to work — an endless build for IDM tension under a pad"
    what_you_hear: "The endless-rising Shepard's Pi from the cold open, now running under a sustained pad — a build that never resolves, used as tension."
