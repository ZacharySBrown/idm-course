      "Engine A Mod Env Attack": 0.5
      "Engine A Mod Env Decay": 1.0
      "Engine A Amp Env Attack": 0.4
      "Engine A Amp Env Sustain": 1.0
      "Engine A Amp Env Release": 0.6
      "Engine B On": "On"
      "Engine B Osc Type": "Sub"                 # type index 18 — quiet body
      "Engine B Osc Macro 1": 0.3                # Tone
      "Engine B Osc Macro 2": 0.2                # Aux
      "Engine B Volume": 0.35
      "Engine B Filter Type": "Lowpass"
      "Engine B Filter Macro 1": 0.4
