      "Engine A On": "On"
      "Engine A Osc Type": "Basic Shapes"
      "Engine A Osc Macro 1": 0.40               # center the AD-Loop env sweeps
      "Engine A Osc Macro 2": 0.50
      "Engine A Filter Type": "Lowpass"
      "Engine A Filter Macro 1": 0.6             # cutoff modulated by audio-rate LFO
      "Engine A Filter Macro 2": 0.2
      "Engine A Mod Env Mode": "AD Loop"
      "Engine A Mod Env Attack": 0.1
      "Engine A Mod Env Decay": 0.35             # sets the self-sequence period
      "Engine A LFO 1 Rate": 200                 # ~200 Hz, audio-rate → sideband grit (UNCERTAIN units; top of range)
      "Engine A LFO 1 Shape": "Sine"
      "Engine A Amp Env Attack": 0.02
      "Engine A Amp Env Sustain": 1.0
      "Engine A Amp Env Release": 0.3
      "Engine B On": "Off"
      "Voicing": "Mono"
    matrix:
