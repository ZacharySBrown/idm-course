# clip_manifest — every audio asset spliced into e04-meld.mp3.
#
# Two families:
#   song_clips    — extracted from acquired tracks via shared/tools/extract_clips.py
#   device_demos  — rendered by the meld-render tool (AbletonOSC / M4L freeze
#                   pipeline; `meld-` prefix). Mirrors e01's operator_demos and
#                   e02/e03's device_demos families, but the device is Ableton Meld
#                   (bi-timbral: two full engines A/B, each with one of 24+1
#                   macro-oscillator types, 2 macros per osc, 17 filter types,
#                   per-engine modulation matrix with MIDI + MPE sources).
#
# ─────────────────────────────────────────────────────────────────────────────
# !! HEADLESS-RENDER CAVEAT (dossier §1.2) — READ BEFORE RENDERING !!
#   Meld's two oscillator macros and ALL matrix amounts are NORMALIZED floats
#   (0–1 / 0–100%), NOT Hz — even when the audible effect is a frequency (FM
#   Ratio, Square Sync Freq 1/2, Bitgrunge Frequency). The public docs give
#   parameter NAMES, not LOM value ranges. So:
#     - Every `params:` value below is BEST-EFFORT and many are marked UNCERTAIN.
#     - Inspect the live `meld` device's LOM (lom_probe / param dump) and
#       calibrate macro/matrix values BY EAR before trusting any render.
#     - Loop-mode names are Meld's own set — Trigger / Loop / AD Loop — NOT
#       Operator's None/Loop/Beat/Sync/Trigger. Do not transplant.
#     - Per-engine pitch = Transpose (semitones, int) + Detune (cents). Macros
#       are addressed by name ("Osc Macro 1" etc.) — exact LOM names UNCERTAIN.
#     - MPE demos: render with an MPE-aware clip (per-note channels). If the
#       headless pipeline can't author MPE, render the channel-aftertouch
#       fallback and flag the demo as fallback (see meld-mpe-per-note).
# ─────────────────────────────────────────────────────────────────────────────
#
# Each entry's `id` matches a slide's `demos:` reference in episode.yaml.
# Output paths: <build_root>/audio/clips/<episode>/<id>.wav
#                = build/ableton-devices/audio/clips/e04-meld/<id>.wav
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED SOURCE WAVs — the user must acquire these and drop them in
#   songs/ableton-ep04/  (git-ignored; copyrighted — cite, don't commit)
# ─────────────────────────────────────────────────────────────────────────────
#   01_polymer-clock.wav    Plaid — "CLOCK" (album Polymer, 2019)
#                             [Tone2 Icarus + Madrona Polymer wavetable scan;
#                              the "timbre-as-composition" exemplar — NOT a Meld claim]
#                             NOTE: "Polymer" is the ALBUM; the cut is "CLOCK"
#                             (or any wavetable-texture track off Polymer). Label
#                             references the album/method, not a title track.
#   02_geogaddi.wav         Boards of Canada — a textural cut from Geogaddi (2002)
#                             [analog + sampler field-recording ambience — the
#                              environmental-texture AESTHETIC target, NOT Meld gear]
#   03_confield.wav         Autechre — a self-generating-pattern cut from Confield (2001)
#                             [custom Max/MSP — the self-sequencing-timbre METHOD
#                              kinship, NOT a Meld-usage claim]
#   04_beep-street.wav      Squarepusher — "Beep Street" (Hard Normal Daddy, 1997)
#                             [TX81Z FM — the FM-feedback growl callback; honest
#                              negative: Squarepusher builds his own tools]
#   05_plaits-module-ref.wav  A short recording of a Mutable Instruments PLAITS
#                             module (or a faithful clone/VCV port) sweeping a
#                             couple of models — the macro-oscillator LINEAGE
#                             reference for 02b. This is a MODULE, not Meld, and
#                             not a commercial track; the user records/sources it
#                             (e.g. VCV Rack render) and drops it in. Labelled on
#                             air as "a Plaits module, the lineage — not Meld."
#
# Acquire as 44.1k/16-or-24-bit stereo WAV. Filenames above are the `source:`
# values below; rename your rips to match (or edit `source:` per entry).
# Timestamps are placeholders from specs/ableton_course_ep4_meld_research.md §4 —
# RE-CUT BY EAR if your rip differs; extract_clips.py re-slices on edit. None of
# these tracks use Meld (2024 instrument, no canon) — every clip is technique /
# aesthetic kinship only. Verify entry points by ear before stating on-mic.

# Where the user drops acquired song WAVs. Override per entry if needed.
song_source_dir: songs/ableton-ep04

