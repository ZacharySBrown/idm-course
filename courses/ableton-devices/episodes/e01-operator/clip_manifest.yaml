    midi: { note: "C3", length_s: 2.5 }
    params:
      "Algorithm": "Alg. 1"
      "Osc-A On": "On"
      "Osc-A Wave": "Sine"
      "A Coarse": 1
      "A Fine": 0
      "Osc-A Level": 0.25
