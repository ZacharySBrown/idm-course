  - id: op-rhythmic-layered
    description: "Polyrhythm: op-rhythmic-single (1/16 @ B Coarse=11) summed with op-rhythmic-instance2 (1/8 dotted @ B Coarse=13)."
    duration_s: 10
    # mix_from is post-processed by device_render.py via ffmpeg amix once both
    # source demos exist. No M4L render is fired for this demo.
    mix_from:
      - op-rhythmic-single
      - op-rhythmic-instance2
