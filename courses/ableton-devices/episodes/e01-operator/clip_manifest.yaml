    duration_s: 10
    midi: { note: "C3", length_s: 9.6 }
    # NOTE: Be Retrig is range 0-14 (continuous in LOM, enum in UI). The
    # mapping isn't explicitly enumerated; 2 is a first guess for "1/16".
    # If audition shows wrong rate, scan integers: 0=1/32?, 1=1/32T?, 2=1/16,
