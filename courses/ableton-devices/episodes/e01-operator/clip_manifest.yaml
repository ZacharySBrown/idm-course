      "Osc-A Level": 1.0
      "Osc-A Feedb": 0
      "Osc-B On": "On"
      "Osc-B Wave": "Sine"
      "B Coarse": 1
      "B Fine": 0
      "Osc-B Level": 0.8
      "Osc-B Feedb": 0
      "Osc-C On": "Off"
      "Osc-D On": "Off"

  - id: op-ratio-1to2
    description: "Same as 1to1 but B Coarse=2. Hollow-clarinet odd-harmonic spectrum."
    duration_s: 5
    midi: { note: "C3", length_s: 4.5 }
    params:
      "Algorithm": "Alg. 1"
      "Osc-A On": "On"
      "Osc-A Wave": "Sine"
      "A Coarse": 1
      "A Fine": 0
      "Osc-A Level": 1.0
      "Osc-A Feedb": 0
      "Osc-B On": "On"
      "Osc-B Wave": "Sine"
      "B Coarse": 2
      "B Fine": 0
      "Osc-B Level": 0.8
      "Osc-B Feedb": 0
      "Osc-C On": "Off"
      "Osc-D On": "Off"

  - id: op-ratio-1to3
