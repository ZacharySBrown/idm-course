      "C Fine": 0
      "Osc-C Level": 0.5
      "Osc-C Feedb": 0
      "Ce Attack": 0.01
      "Ce Decay": 0.08
      "Ce Sustain": 0.0
      "Ce Release": 0.08
      "Osc-D On": "Off"

  - id: op-poly-bell-step5
    description: "Step 4 + Feedback on C at 30%. Gritty edge appears in attack."
