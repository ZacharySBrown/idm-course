id: e05-warp-modes
title: "Warp Modes as Sound Design"
device: Warp                  # Live's audio-warp engine, NOT a synth — demos are WARPED AUDIO
synthesis_type: "Audio time-stretch (granular / phase-vocoder / varispeed)"
week: 5                        # episode-number alias for shared build_episode
target_duration_minutes: 40
ableton_manual_url: "https://www.ableton.com/en/manual/audio-clips-tempo-and-warping/"

idm_primary_artists:
  - Oval
  - Akufen
  - Jon Hopkins
idm_primary_records:
  - "Oval — Systemisch"
  - "Akufen — My Way"
  - "Shamantis — U Smile 800% Slower (PaulStretch)"
adjacent_genres:
  - glitch
  - microhouse
  - ambient
  - jungle

# Bibliography references checked by validate.ts; full entries in references/bibliography.json.
# (ids to be reconciled against the bibliography during fact-check; sourced from the dossier.)
references:
  - bib:ableton_manual_warping
  - bib:zplane_elastique
  - bib:gabor_1946
  - bib:xenakis_formalized_music
  - bib:roads_microsound_2001
  - bib:truax_riverrun
  - bib:flanagan_golden_1966
  - bib:portnoff_1976
  - bib:dolson_pvoc_tutorial
  - bib:bernsee_pitch_time_overview
  - bib:paulnasca_paulstretch
  - bib:npr_u_smile_800
  - bib:oval_systemisch
  - bib:ableton_artists_akufen
  - bib:ra_hopkins_3210
  - bib:cdm_hopkins_live
  - bib:soundhack_erbe
