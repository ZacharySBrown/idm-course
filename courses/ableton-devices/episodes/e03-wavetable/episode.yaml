id: e03-wavetable
title: "Wavetable: Morphing Through Spectra"
device: Wavetable
synthesis_type: "Wavetable (position-scan over single-cycle frames + Cytomic filters)"
week: 3                        # episode-number alias for shared build_episode
target_duration_minutes: 40
ableton_manual_url: "https://www.ableton.com/en/manual/live-instrument-reference/"

idm_primary_artists:
  - Plaid
  - Aphex Twin
  - Autechre
idm_primary_records:
  - "Plaid — Polymer"
  - "Depeche Mode — A Broken Frame"
  - "Skrillex — Scary Monsters and Nice Sprites"
adjacent_genres:
  - synth-pop
  - dubstep
  - melodic bass / EDM

