# clip_manifest — every audio asset spliced into e03-wavetable.mp3.
#
# Two families:
#   song_clips    — extracted from acquired tracks via shared/tools/extract_clips.py
#   device_demos  — rendered by the wavetable-render tool (AbletonOSC / M4L freeze
#                   pipeline; `wt-` prefix). Mirrors e01's operator_demos and e02's
#                   device_demos families, but the device is Ableton Wavetable
#                   (two wavetable oscillators + Sub, destination-first matrix,
#                   Cytomic filters). Param names are Wavetable's LOM-exposed
#                   names where known; UNCERTAIN ones are flagged inline.
#
# Each entry's `id` matches a slide's `demos:` reference in episode.yaml.
# Output paths: <build_root>/audio/clips/<episode>/<id>.wav
#                = build/ableton-devices/audio/clips/e03-wavetable/<id>.wav
#
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED SOURCE WAVs — the user must acquire these and drop them in
#   songs/ableton-ep03/  (git-ignored; copyrighted — cite, don't commit)
# ─────────────────────────────────────────────────────────────────────────────
#   01_see-you.wav          Depeche Mode — "See You" (1982, A Broken Frame)   [PPG Wave 2 — choir + bell]
#   02_everybody-wants.wav  Tears for Fears — "Everybody Wants to Rule the World" (1985)
#                                                                              [PPG Wave 2.3 click under DX7 bass]
#   03_scary-monsters.wav   Skrillex — "Scary Monsters and Nice Sprites" (2010)
#                                                                              [NI Massive + FM8 growl — NOT Serum]
#   04_polymer.wav          Plaid — "CLOCK" (from the album Polymer, 2019)  [Tone2 Icarus 3D-wavetable scan]
#       NOTE: Polymer is the ALBUM — there is no title track named "Polymer". The
#       acquired file is "CLOCK" (a wavetable-texture cut). The script references
#       the album/method, not a track, so the clip stands; this corrects the label.
#
# Acquire as 44.1k/16-or-24-bit stereo WAV. Filenames above are the `source:`
# values below; rename your rips to match (or edit `source:` per entry).
# Timestamps are from specs/ableton_course_ep3_wavetable_research.md §3–§4;
# RE-CUT BY EAR if your rip differs — extract_clips.py re-slices on edit.
# Verify the "See You" / "Everybody Wants" / "Scary Monsters" entry points by
# ear before stating anything on-mic — pressing/edit versions differ.

# Where the user drops acquired song WAVs. Override per entry if needed.
song_source_dir: songs/ableton-ep03

# ═══════════════════════════════════════════════════════════════════════════════
