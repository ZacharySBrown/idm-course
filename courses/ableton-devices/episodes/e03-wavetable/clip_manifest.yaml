  # ── 06a — Import your own wavetable and scan it (Plaid Polymer method) ──────
  - id: wt-user-table-scan
    concept: "User-imported wavetable + Env/LFO → Position → scanning your OWN source as texture"
    what_you_hear: "A held note on a wavetable built from an imported audio file (a vowel / field recording / resampled FM patch), with Position scanned by a slow envelope — your own sound morphing, not a factory table."
    structure: sweep
    isolates: "Osc 1 Wave Position over a USER-IMPORTED table (Env → Position)"
    duration_s: 6.0
    midi: {note: "C3", length_s: 5.7}
    verification:
      check: user-table-scan
      audible: "A morphing tone clearly derived from a non-standard (imported) source; timbre changes across the held note."
      spectral: "Spectral content evolves monotonically/clearly across the clip; the source spectrum is distinct from the factory Basic Shapes tables."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "User"             # UNCERTAIN — imported-table slot
      "Osc 1 Wavetable Table": "(imported audio file — up to 256 frames)"  # render-time: drag a WAV onto sprite area
      "Osc 1 Wave Position": 0.0                       # scanned by Env 2 below
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 0.95
      "Filter 1 Reso": 0.1
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.2
      "Env 2 Mode": "None"                            # slow scan envelope
      "Env 2 Attack": 0.7                             # long — scans Position across the note
      "Env 2 Decay": 0.0
      "Env 2 Sustain": 1.0
      "Env 2 Release": 0.2
    matrix:
