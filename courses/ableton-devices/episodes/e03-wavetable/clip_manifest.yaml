    start: "0:00"
    end: "0:10"
    fade_in_ms: 150
    fade_out_ms: 900
    normalize_lufs: -16
    notes: "Same 'See You' choir/bell pad, cued in 02b as the 'this IS a PPG wavetable' example. The bell riff with metallic overtones should be audible. If identical to the cold-open clip is undesirable, nudge start to catch the bell riff (≈0:08+)."

  - id: everybody-wants-bass
