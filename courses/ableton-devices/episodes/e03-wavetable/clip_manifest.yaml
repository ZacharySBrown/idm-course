    # the render rig (e.g. a resampled Operator FM patch or a sung vowel); not a
    # copyrighted song. Document the exact file at render time.

  # ── 06b — Loop envelope → Position: rhythm from synthesis ───────────────────
  - id: wt-loop-env-sequence
    concept: "Free envelope in Loop → Position → a self-sequencing timbral pattern from ONE held note"
    what_you_hear: "A single held note that becomes a repeating rhythmic timbre pattern, because a free envelope in Loop mode cycles Position on the grid (plus a 1/16 LFO on FM Amount for grit). No new notes are played."
    structure: single
    isolates: "Env 2 Mode = Loop (synced) → Position (the rhythmic engine)"
    duration_s: 8.0
    midi: {note: "C3", length_s: 7.7}                 # ONE held note for the whole clip
    verification:
      check: loop-env-rhythm
      audible: "A steady repeating timbral pattern at a clear grid rate, from a single sustained key."
      spectral: "Onset/spectral-flux peaks recur at a fixed grid rate matching the loop-envelope cycle (e.g. ~1/8 or 1/16 @ tempo). No periodic recurrence ⇒ the loop mode didn't engage ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 0.0                       # cycled by the loop envelope
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "FM"
      "Osc 1 Effect 1": 0.1                            # base FM amount; LFO adds rhythmic grit
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "MS2"
      "Filter 1 Freq": 0.7
      "Filter 1 Reso": 0.2
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.02
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.1
      "Env 2 Mode": "Loop"                            # the rhythmic engine (the ONE variable)
      "Env 2 Rate": "1/8"                             # synced loop period; UNCERTAIN format
      "Env 2 Attack": 0.1
      "Env 2 Decay": 0.4
      "Env 2 Sustain": 0.0
      "LFO 1 Shape": "Square"
      "LFO 1 Rate": "1/16"                            # synced; grit on FM Amount
    matrix:
      - {source: "Env 2", destination: "Osc 1 Wave Position", amount: 90}
      - {source: "LFO 1", destination: "Osc 1 Effect 1", amount: 30}   # 1/16 grit on FM Amount

  # ── 06c — Aliasing on purpose: Hi-Q off + Fold (the Hamburg grit) ───────────
  - id: wt-hiq-off-grit
    concept: "Hi-Q OFF + Modern→Fold + fast sweep → the PPG/Hamburg grit, on purpose"
    what_you_hear: "A fast Position sweep through a Distortion-category table with Hi-Q OFF and Fold pushed up: deliberately gritty, aliased, lo-fi — the harsh PPG sound Palm kept."
    structure: single
    isolates: "Hi-Q OFF (with Fold up + fast sweep) — the aliasing aesthetic as a choice"
    duration_s: 5.0
    midi: {note: "C4", length_s: 4.7}
    verification:
      check: grit-on-purpose
      audible: "Obvious gritty/aliased buzz throughout — distinct from the clean Hi-Q-on demos."
      spectral: "Strong inharmonic / non-integer partials and a raised inter-harmonic noise floor present throughout (uncorrected aliasing). Clean harmonic comb ⇒ Hi-Q wasn't actually off ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Distortion"       # UNCERTAIN
      "Osc 1 Wavetable Table": "(harsh distortion table)"  # UNCERTAIN exact name
      "Osc 1 Wave Position": 0.0
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "Modern"
      "Osc 1 Effect 1": 0.0                           # Warp
      "Osc 1 Effect 2": 0.7                           # Fold up (which slot is Fold — UNCERTAIN)
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "OSR"
      "Filter 1 Freq": 0.85
      "Filter 1 Reso": 0.15
      "Filter 1 Drive": 0.4                           # a little Drive for edge; UNCERTAIN name
      "Filter 2 On": "Off"
      "Hi-Q": "Off"                                   # the ONE variable — aliasing left IN
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.02
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.1
    automation:
      "Osc 1 Wave Position": {from: 0.0, to: 100.0, ramp_s: 1.5}   # FAST sweep so aliasing is loud

  # ── 06d — MPE: per-note Pressure → Position ─────────────────────────────────
  - id: wt-mpe-pressure-position
    concept: "MPE Pressure → Position → per-note timbre scanned by finger pressure"
    what_you_hear: "A held chord where each note's brightness rises independently as per-note Pressure increases — the timbre scanned per voice, not globally."
    structure: ladder
    isolates: "Per-note Pressure value (low / mid / high) → Position, identical notes"
    duration_s: 6.0
    midi:
      # Three identical notes, increasing per-note pressure (MPE). Renderer must
      # emit per-note channel pressure (MPE), not channel aftertouch.
      notes:
        - {note: "C3", t: 0.0, length_s: 1.6, mpe_pressure: 0.1}   # low
        - {note: "C3", t: 2.0, length_s: 1.6, mpe_pressure: 0.5}   # mid
        - {note: "C3", t: 4.0, length_s: 1.6, mpe_pressure: 0.95}  # high
    verification:
      check: mpe-pressure-ladder
      audible: "Three identical pitches at rising brightness; each step audibly brighter than the last."
      spectral: "Spectral centroid increases monotonically across the three notes (low<mid<high) at identical f0. Equal across notes ⇒ Pressure→Position didn't take ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 10.0                      # baseline; Pressure scans upward
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 0.95
      "Filter 1 Reso": 0.05
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "MPE Enable": "On"                              # UNCERTAIN LOM name (MIDI tab)
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15
    matrix:
      - {source: "Pressure", destination: "Osc 1 Wave Position", amount: 80}   # MPE per-note source
