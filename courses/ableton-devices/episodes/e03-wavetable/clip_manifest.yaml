# ═══════════════════════════════════════════════════════════════════════════════
# DEVICE DEMOS — Ableton Wavetable patches rendered via the wavetable-render
# pipeline (AbletonOSC / M4L freeze; `wt-` prefix).
# Output: build/ableton-devices/audio/clips/e03-wavetable/<id>.wav
#
# Each demo ISOLATES ONE variable and has a teaching `structure` (ab/sweep/
# ladder/single) chosen so the change is obvious on laptop + phone speakers.
# `verification.check` names the Gate-7 machine assertion; audible/spectral
# describe the pass condition. `params` is the patch step-table (best-effort
# Wavetable LOM names + values; lines marked UNCERTAIN need calibration by ear
# on first render — Wavetable's LOM names are not all documented).
#
# PARAM-NAME NOTES (resolve during render scaffolding):
#   - "Osc 1 On"/"Osc 2 On"/"Sub On"  — the per-oscillator cube toggles.
#   - "Osc 1 Wavetable Category"/"... Table" — dropdown selectors; Wavetable's
#     LOM may expose these as indices, not strings. Names below are the UI
#     labels; map to indices at render time.  [UNCERTAIN names]
#   - "Osc 1 Wave Position" — the marquee Position destination, 0..100 in UI;
#     matrix range is -100..+100. Treat the values below as UI-percent (0..100).
#   - "Osc 1 Effect Mode" ∈ {None, FM, Classic, Modern}; effect params are
#     "Osc 1 Effect 1"/"Osc 1 Effect 2" (FM=Amount/Tune, Classic=PW/Sync,
#     Modern=Warp/Fold). Exact LOM names UNCERTAIN — calibrate by ear.
#   - "Filter 1 ..." Freq/Reso/Drive/Type; "Filter Routing" ∈ {Serial,Parallel,
#     Split}; "Filter 1 Circuit" ∈ {Clean,OSR,MS2,SMP,PRD}.  [names UNCERTAIN]
#   - "Hi-Q" (Global) — oversampling toggle; LOM name UNCERTAIN (may be
#     "High Quality" / "Oversampling").
#   - Envelopes: "Env N Attack/Decay/Sustain/Release" + "Env N Mode"
#     ∈ {None,Trigger,Loop}; times are normalized 0..1 (non-linear) — adjust by
#     ear, mirroring e01/e02.
#   - LFOs: "LFO N Shape", "LFO N Rate" (synced via note icon), "LFO N Attack"
#     (fade-in), "LFO N Restart".  [names UNCERTAIN]
#   - The modulation matrix is destination-first: a routing is declared in the
#     `matrix:` block as {source -> destination: amount}. The renderer must
#     create that matrix row (in the UI you tweak the destination so it appears,
#     then assign the source). Amounts are in matrix units (Position uses the
#     -100..+100 scale).
# Each demo sets every relevant param explicitly so it is self-contained (the
# render does not reset Wavetable between demos).
# ═══════════════════════════════════════════════════════════════════════════════
device_demos:

  # ── 03a — Position itself: pitch/timbre orthogonality (THE key demo) ────────
  - id: wt-position-by-hand
    concept: "Position → which waveform you play (timbre), with pitch held constant"
    what_you_hear: "One held note, constant in pitch and loudness, walking sine → triangle → saw → square as Position scans the table by hand. Nothing but the harmonic content changes."
    structure: sweep
    isolates: "Osc 1 Wave Position (Basic Shapes table, scanned 0 → 100)"
    duration_s: 5.0
    midi: {note: "C3", length_s: 4.7}
    verification:
      check: position-sweep
      audible: "Pitch and loudness constant the whole clip; only the timbre changes (sine→tri→saw→square)."
      spectral: "Spectral centroid rises monotonically and harmonic count increases start→end while the fundamental f0 stays fixed. Flat centroid ⇒ the Position scan didn't take ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"          # UNCERTAIN LOM name
      "Osc 1 Wavetable Table": "Basic Shapes"       # UNCERTAIN LOM name (sine→tri→saw→square)
      "Osc 1 Wave Position": 0.0                     # swept by automation below (UI 0..100)
      "Osc 1 Transpose": 0
      "Osc 1 Detune": 0
      "Osc 1 Gain": 0.0                              # dB; unity into the filter
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"                     # UNCERTAIN name
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"                    # transparent — must NOT color the demo
      "Filter 1 Freq": 1.0                           # wide open / effectively bypassed
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "On"                                   # clean scan so Position is the only variable
      "Env 1 Mode": "None"                           # Env 1 = Amp
      "Env 1 Attack": 0.05
      "Env 1 Decay": 0.0
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15
    automation:
      "Osc 1 Wave Position": {from: 0.0, to: 100.0, ramp_s: 4.5}   # full table, smooth scan

  # ── 03b — A wavetable IS a collection of spectra (A/B two positions) ────────
  - id: wt-ab-two-positions
    concept: "A wavetable is a collection of spectra — two positions of ONE table are two distinct timbres"
    what_you_hear: "The same note played twice, same table: first at a low Position, beat of silence, then at a high Position. Two clearly different tones from one waveform set."
    structure: ab
    isolates: "Osc 1 Wave Position (low vs high in the SAME table)"
    duration_s: 5.0
    midi:
      notes:
        - {note: "C3", t: 0.0, length_s: 2.0}    # segment A: low Position
        - {note: "C3", t: 2.6, length_s: 2.0}    # segment B: high Position
    verification:
      check: position-ab
      audible: "Same pitch both segments; segment B is audibly brighter/richer than A."
      spectral: "Segment B has measurably higher spectral centroid / more harmonics than A at the identical f0. A ≈ B ⇒ reject."
    ab_param: "Osc 1 Wave Position"
    ab_values: [10.0, 85.0]                          # A=low, B=high (UI 0..100)
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 10.0                     # segment A value (the ONE variable)
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 1.0                            # open; identical both segments
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Decay": 0.0
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15

  # ── 03c — Interpolation: zipper vs smooth scan ──────────────────────────────
  - id: wt-zipper-vs-smooth
    concept: "Frame interpolation → a stepped scan becomes a continuous glide"
    what_you_hear: "The same slow Position sweep played twice: first stepping/zippering between frames (no interpolation, Hi-Q off proxy), then a smooth continuous morph (interpolated, Hi-Q on). The second glides where the first stairsteps."
    structure: ab
    isolates: "Hi-Q / interpolation (stepped vs interpolated scan; everything else held)"
    duration_s: 7.0
    midi:
      notes:
        - {note: "C3", t: 0.0, length_s: 3.0}    # segment A: stepped (Hi-Q off proxy)
        - {note: "C3", t: 3.4, length_s: 3.0}    # segment B: smooth (Hi-Q on)
    verification:
      check: interpolation-ab
      audible: "Segment A has audible stepping/zipper artifacts during the sweep; segment B is a continuous glide."
      spectral: "Segment A shows discontinuous frame-to-frame spectral jumps (high frame-to-frame flux variance); segment B's spectral change is smooth/monotone. A's flux ≈ B's ⇒ reject (interpolation made no difference)."
    ab_param: "Hi-Q"
    ab_values: ["Off", "On"]                         # A=stepped proxy, B=interpolated
    # Both segments run the SAME slow Position sweep (below); only Hi-Q changes.
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 0.0
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 1.0
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "Off"                                   # segment A value (the ONE variable)
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15
    automation:
      "Osc 1 Wave Position": {from: 0.0, to: 100.0, ramp_s: 2.8}   # same sweep in BOTH segments
    # NOTE: Ableton always interpolates frames; "stepped" is approximated by
    # Hi-Q off + a fast scan on a high-harmonic table so aliasing/stepping is
    # audible. If the contrast is too subtle, render segment A from a coarse
    # hand-stepped Position automation (discrete jumps) instead.  [calibrate]

  # ── 03d — Aliasing: Hi-Q off (PPG) vs on (Serum) ────────────────────────────
  - id: wt-hiq-on-vs-off
    concept: "Hi-Q (oversampling) → aliasing removed; the PPG-vs-Serum aesthetic in one switch"
    what_you_hear: "A fast Position sweep on a bright table played twice: Hi-Q OFF first (gritty, aliased — a PPG), then Hi-Q ON (clean glide — a Serum). The grit vanishes on the second pass."
    structure: ab
    isolates: "Hi-Q (oversampling off vs on; same fast sweep both segments)"
    duration_s: 6.0
    midi:
      notes:
        - {note: "C5", t: 0.0, length_s: 2.4}    # high note exaggerates aliasing; segment A: Hi-Q off
        - {note: "C5", t: 3.0, length_s: 2.4}    # segment B: Hi-Q on
    verification:
      check: aliasing-ab
      audible: "Segment A has audible inharmonic 'grit'/buzz during the fast sweep; segment B is clean."
      spectral: "Segment A shows inharmonic (non-integer-multiple) partials / raised noise floor between harmonics; segment B's energy sits on the harmonic comb of f0. A ≈ B ⇒ reject."
    ab_param: "Hi-Q"
    ab_values: ["Off", "On"]                         # A=PPG grit, B=Serum clean
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Distortion"       # UNCERTAIN — a bright/harmonic-rich table
      "Osc 1 Wavetable Table": "(bright distortion table)"  # UNCERTAIN exact name; pick a high-harmonic one
      "Osc 1 Wave Position": 0.0
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 1.0                            # open so aliasing is not masked
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "Off"                                   # segment A value (the ONE variable)
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.02
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.1
    automation:
      "Osc 1 Wave Position": {from: 0.0, to: 100.0, ramp_s: 2.0}   # FAST sweep, same in both segments

  # ── 03e — FM inside the wavetable oscillator (the Operator bridge) ──────────
  - id: wt-fm-inside-wavetable
    concept: "The hidden FM oscillator → harmonics generated INSIDE the wavetable osc (the Ep1 bridge)"
    what_you_hear: "One held note, fixed Position, opening from the bare wavetable tone into a metallic, sideband-rich buzz as FM Amount sweeps up — harmonics grown, not scanned."
    structure: sweep
    isolates: "Osc 1 Effect Amount (FM Amount), Position held fixed"
    duration_s: 5.0
    midi: {note: "C3", length_s: 4.7}
    verification:
      check: fm-amount-sweep
      audible: "Pitch and loudness roughly constant; only harmonic content rises as the metallic FM edge fades in."
      spectral: "FM sidebands appear and grow; spectral centroid / inharmonic-content rises monotonically while Position is fixed. Flat centroid ⇒ FM Amount didn't engage ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 30.0                     # FIXED — Position is NOT the variable here
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "FM"                       # hidden-sine FM engine
      "Osc 1 Effect 1": 0.0                           # FM Amount — swept by automation (the ONE variable)
      "Osc 1 Effect 2": 0.0                           # FM Tune = 0 (modulator at osc pitch); ±2 oct range
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 1.0
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15
    automation:
      "Osc 1 Effect 1": {from: 0.0, to: 0.85, ramp_s: 4.3}   # FM Amount 0 → high

  # ── 04b — Modern→Fold wavefolder sweep ──────────────────────────────────────
  - id: wt-modern-fold-sweep
    concept: "Modern→Fold (wavefolding) → buzzy upper harmonics from one oscillator, no extra device"
    what_you_hear: "A held note, fixed Position, growing from a plain tone into a buzzy, harmonically dense wavefold as Fold amount sweeps up — the wave driven into itself."
    structure: sweep
    isolates: "Osc 1 Effect Fold amount (Modern mode), Position held fixed"
    duration_s: 5.0
    midi: {note: "C3", length_s: 4.7}
    verification:
      check: fold-sweep
      audible: "Pitch constant; harmonic density/brightness rises as the fold deepens."
      spectral: "Upper-harmonic energy and spectral spread increase monotonically start→end at fixed f0. Flat ⇒ Fold didn't engage ⇒ reject."
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 25.0                     # FIXED
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "Modern"
      "Osc 1 Effect 1": 0.0                           # Warp = 0
      "Osc 1 Effect 2": 0.0                           # Fold — swept (the ONE variable). UNCERTAIN which slot is Fold
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "Clean"
      "Filter 1 Freq": 1.0
      "Filter 1 Reso": 0.0
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.05
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.15
    automation:
      "Osc 1 Effect 2": {from: 0.0, to: 0.9, ramp_s: 4.3}    # Fold 0 → high

  # ── 04c — LFO → Position wobble (pitch unchanged), the matrix in action ─────
  - id: wt-lfo-to-position
    concept: "LFO → Position in the matrix → timbral wobble with NO pitch change (the dubstep 'wub')"
    what_you_hear: "A held note that wobbles in timbre at a synced 1/8 — the tone scanning back and forth through the table — while the pitch never moves."
    structure: single
    isolates: "LFO 1 → Wave Position routing (the only modulation; pitch/filter held)"
    duration_s: 5.0
    midi: {note: "C3", length_s: 4.7}
    verification:
      check: lfo-position-wobble
      audible: "Pitch dead constant; timbre/brightness oscillates at a steady ~1/8 rate."
