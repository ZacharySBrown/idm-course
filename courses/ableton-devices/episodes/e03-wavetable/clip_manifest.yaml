    what_you_hear: "The pad, unchanged at the surface, now ARMED: a fast 1/8 LFO 2 → Position is in the matrix but bypassed, an Env → Filter Freq is added, and Osc 1's effect is switched to FM (amount ~20) for a metallic edge."
