song_clips:

  # ── Foreground cues (referenced by id from episode.yaml > slides[].demos) ───
  - id: see-you-cold-open
    source: "01_see-you.wav"
    start: "0:00"
    end: "0:12"
    fade_in_ms: 0
    fade_out_ms: 2200
    normalize_lufs: -14          # cold-open hero clip: leave louder, ducks under narration
    notes: "Depeche Mode 'See You' intro — the ghostly PPG choir pad ALONE before the beat. Hold ~10s, fade under as narration enters. The canonical glassy wavetable choir. Re-cut start by ear: the bare pad must be isolated (no drums)."

