    duration_s: 7.0
    midi: {note: "C3", length_s: 6.7}
    verification:
      check: lfo-attack-bloom
      audible: "First ~2 s static; movement appears and deepens only in the second half of the held note."
      spectral: "Spectral-centroid oscillation amplitude is near zero for the first ~2 s, then grows. Movement present from t=0 ⇒ the LFO Attack fade-in didn't take ⇒ reject."
    params:
      "Osc 1 On": "On"
