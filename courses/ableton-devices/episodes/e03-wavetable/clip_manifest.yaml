  # ── 04e — Position Spread unison: a chord of timbres from one note ──────────
  - id: wt-position-spread-chord
    concept: "Position Spread unison → each voice at a different Position = a chord of timbres from ONE note"
    what_you_hear: "A single held note (mono unison off) then the SAME note with Position Spread unison: a stack of distinct timbres ringing together, where before there was one."
    structure: ab
    isolates: "Unison Mode (Off vs Position Spread); same single note both segments"
    duration_s: 5.0
    midi:
      notes:
        - {note: "C3", t: 0.0, length_s: 2.0}    # segment A: unison off (one timbre)
        - {note: "C3", t: 2.6, length_s: 2.0}    # segment B: Position Spread (chord of timbres)
    verification:
      check: position-spread-ab
      audible: "Same pitch both segments; segment B is audibly wider and richer (multiple timbres at once)."
      spectral: "Segment B shows more distinct spectral peaks / broader harmonic content and wider stereo spread than A at the same f0. A ≈ B ⇒ reject."
    ab_param: "Unison Mode"
    ab_values: ["None", "Position Spread"]           # A=off, B=spread; UNCERTAIN LOM enum strings
    params:
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Basics"           # UNCERTAIN
      "Osc 1 Wavetable Table": "Basic Shapes"        # UNCERTAIN
      "Osc 1 Wave Position": 50.0
      "Osc 1 Gain": 0.0
      "Osc 1 Effect Mode": "None"
      "Osc 2 On": "Off"
      "Sub On": "Off"
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "OSR"
      "Filter 1 Freq": 0.85
      "Filter 1 Reso": 0.1
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Unison Mode": "None"                           # segment A value (the ONE variable)
      "Unison Voices": 4                              # used by segment B
      "Unison Amount": 0.3                            # light detune for B
      "Env 1 Mode": "None"
      "Env 1 Attack": 0.1
      "Env 1 Sustain": 1.0
      "Env 1 Release": 0.3

