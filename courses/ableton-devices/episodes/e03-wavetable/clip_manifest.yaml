  - id: wt-spectra-macro-sweep
    concept: "Walkthrough step 6 of 7 — ONE macro turns the pad into a growl (the payoff)"
    what_you_hear: "The same patch as one Macro sweeps 0 → 127: at 0 it's the slow PPG pad; by 127 the fast 1/8 LFO wobble engages, the filter tightens, and mono/glide kicks in — a dubstep growl. Same oscillators, same table, one decision apart."
    structure: sweep
    isolates: "Macro 1 (0 → 127), which crossfades slow-LFO→Position out and fast-LFO→Position + filter-tighten + mono in"
    duration_s: 8.0
    midi:
      notes:                                          # one sustained note so the macro move is the only change
        - {note: "C2", t: 0.0, length_s: 7.5}
    verification:
      check: macro-pad-to-growl
      audible: "Starts as a slow morphing pad; ends as a fast rhythmic growl on the SAME note. The transformation is continuous and driven only by the macro."
      spectral: "Spectral-centroid modulation rate rises from sub-1 Hz (pad) to ~1/8-synced (growl) across the clip; high-band energy increases as the filter tightens then opens on the wobble. No change in modulation rate ⇒ the macro didn't remap ⇒ reject."
    params:
      # Same patch as step 5; the macro re-maps the live controls below.
      "Osc 1 On": "On"
      "Osc 1 Wavetable Category": "Formants"         # UNCERTAIN
      "Osc 1 Wavetable Table": "(vocal/choir formant table)"  # UNCERTAIN
      "Osc 1 Wave Position": 35.0
      "Osc 1 Effect Mode": "FM"
      "Osc 1 Effect 1": 0.2
      "Osc 2 On": "On"
      "Osc 2 Transpose": 12
      "Osc 2 Gain": -12.0
      "Sub On": "On"
      "Sub Transpose": -12
      "Sub Tone": 0.15
      "Filter Routing": "Serial"
      "Filter 1 On": "On"
      "Filter 1 Type": "Lowpass"
      "Filter 1 Circuit": "OSR"
      "Filter 1 Freq": 0.8
      "Filter 1 Reso": 0.2
      "Filter 2 On": "Off"
      "Hi-Q": "On"
      "Unison Mode": "Position Spread"
      "Unison Voices": 4
      "LFO 1 Rate": "0.5 Hz"
      "LFO 1 Attack": 0.6
      "LFO 2 Shape": "Saw"
      "LFO 2 Rate": "1/8"
      "Voices": 8
      "Mono": "Off"                                   # macro turns this On at full
      "Glide": 0.0                                    # macro adds glide at full
    matrix:
      - {source: "LFO 1", destination: "Osc 1 Wave Position", amount: 30}
      - {source: "LFO 2", destination: "Osc 1 Wave Position", amount: 0}    # macro raises this
      - {source: "Env 2", destination: "Filter 1 Freq", amount: 35}
    macros:
      # Macro 1: 0 = pad, 127 = growl. Each mapping crossfades across the macro range.
      - name: "Pad ↔ Growl"
        param: "Macro 1"
        mappings:
          - {target: "matrix: LFO 1 -> Osc 1 Wave Position", from: 30, to: 0}     # slow pad scan out
          - {target: "matrix: LFO 2 -> Osc 1 Wave Position", from: 0, to: 50}     # fast wobble in
          - {target: "Filter 1 Freq", from: 0.8, to: 0.5}                          # filter tightens
          - {target: "Mono", from: "Off", to: "On"}                                # mono/glide for the bass
          - {target: "Glide", from: 0.0, to: 0.1}
    automation:
      "Macro 1": {from: 0.0, to: 127.0, ramp_s: 7.0}   # sweep the macro live across the held note

